name: Publish CRAN release

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/publish-cran-release.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: v0.1.3
      RELEASE_SHA: 44f9967e6517b57ebc9d47d46f2de018665bfefe
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create the version tag when absent
        shell: bash
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Tag ${RELEASE_TAG} already exists."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${RELEASE_TAG}" "${RELEASE_SHA}" -m "ecoGLMM 0.1.3"
            git push origin "${RELEASE_TAG}"
          fi

      - name: Write release notes
        shell: bash
        run: |
          cat > "${RUNNER_TEMP}/release-notes.md" <<'EOF'
          ## ecoGLMM 0.1.3

          First CRAN release of ecoGLMM.

          - CRAN: https://cran.r-project.org/package=ecoGLMM
          - DOI: https://doi.org/10.32614/CRAN.package.ecoGLMM
          - Published: 30 September 2026

          This release provides a reproducible candidate-model pipeline for ecological generalized linear mixed models, including AICc model selection, likelihood-ratio tests, coefficient extraction, Nakagawa R-squared, DHARMa diagnostics, figures, and spreadsheet exports.
          EOF

      - name: Publish the GitHub release when absent
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists."
          else
            gh release create "${RELEASE_TAG}"               --verify-tag               --title "ecoGLMM 0.1.3"               --notes-file "${RUNNER_TEMP}/release-notes.md"               --latest
          fi
